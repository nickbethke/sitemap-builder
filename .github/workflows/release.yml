# Build macOS, Windows, and Linux artifacts, then draft a release for version tags.
# Requires committed package-lock.json (npm ci).
name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-macos:
    environment: production
    runs-on: macos-latest

    env:
      # Optional signing/notarization secrets. Unsigned DMG built when MAC_CERTIFICATE is empty.
      MAC_CERTIFICATE: ${{ secrets.MAC_CERTIFICATE }}
      MAC_CERTIFICATE_PWD: ${{ secrets.MAC_CERTIFICATE_PWD }}
      MAC_KEYCHAIN_PWD: ${{ secrets.MAC_KEYCHAIN_PWD }}
      MAC_CODESIGN_IDENTITY: ${{ secrets.MAC_CODESIGN_IDENTITY }}
      MAC_TEAM_ID: ${{ secrets.MAC_TEAM_ID }}
      MAC_APPLE_ID: ${{ secrets.MAC_APPLE_ID }}
      MAC_APPLE_PASSWORD: ${{ secrets.MAC_APPLE_PASSWORD }}

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Verify signing secrets
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${MAC_CERTIFICATE:-}" ]; then
            echo "MAC_CERTIFICATE not set; building unsigned DMG."
            {
              echo "MAC_CERTIFICATE_PWD="
              echo "MAC_KEYCHAIN_PWD="
              echo "MAC_CODESIGN_IDENTITY="
              echo "MAC_TEAM_ID="
              echo "MAC_APPLE_ID="
              echo "MAC_APPLE_PASSWORD="
            } >> "$GITHUB_ENV"
            exit 0
          fi

          missing=()
          [ -z "${MAC_CERTIFICATE_PWD:-}" ] && missing+=(MAC_CERTIFICATE_PWD)
          [ -z "${MAC_KEYCHAIN_PWD:-}" ] && missing+=(MAC_KEYCHAIN_PWD)
          [ -z "${MAC_CODESIGN_IDENTITY:-}" ] && missing+=(MAC_CODESIGN_IDENTITY)
          [ -z "${MAC_TEAM_ID:-}" ] && missing+=(MAC_TEAM_ID)
          [ -z "${MAC_APPLE_ID:-}" ] && missing+=(MAC_APPLE_ID)
          [ -z "${MAC_APPLE_PASSWORD:-}" ] && missing+=(MAC_APPLE_PASSWORD)
          if [ ${#missing[@]} -gt 0 ]; then
            echo "Missing required signing secrets: ${missing[*]}"
            exit 1
          fi

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Import signing certificate
        if: env.MAC_CERTIFICATE != ''
        shell: bash
        run: |
          set -euo pipefail
          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain"
          security create-keychain -p "$MAC_KEYCHAIN_PWD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$MAC_KEYCHAIN_PWD" "$KEYCHAIN_PATH"

          curl -fsSL https://www.apple.com/certificateauthority/AppleRootCA-G3.cer -o "$RUNNER_TEMP/AppleRootCA-G3.cer"
          curl -fsSL https://www.apple.com/certificateauthority/AppleWWDRCAG6.cer -o "$RUNNER_TEMP/AppleWWDRCAG6.cer"
          curl -fsSL https://www.apple.com/certificateauthority/DeveloperIDG2CA.cer -o "$RUNNER_TEMP/DeveloperIDG2CA.cer"
          security import "$RUNNER_TEMP/AppleRootCA-G3.cer" -k "$KEYCHAIN_PATH"
          security import "$RUNNER_TEMP/AppleWWDRCAG6.cer" -k "$KEYCHAIN_PATH"
          security import "$RUNNER_TEMP/DeveloperIDG2CA.cer" -k "$KEYCHAIN_PATH"

          echo "$MAC_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security import "$RUNNER_TEMP/certificate.p12" -k "$KEYCHAIN_PATH" -P "$MAC_CERTIFICATE_PWD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$MAC_KEYCHAIN_PWD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | tr -d '"')

      - name: Build application
        run: npm run build -- --verbose

      - name: Pack DMG
        run: npm run pack -- --verbose

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: artifacts-macos
          path: |
            build/dist/mac-*/pack/*.dmg
            build/dist/mac-*/pack/*.nupkg
            build/dist/mac-*/pack/releases.osx.json
          if-no-files-found: error

  build-windows:
    name: Build Windows x64
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build -- --verbose

      - name: Pack Windows installer
        run: npm run pack -- --verbose

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: artifacts-windows-x64
          path: |
            build/dist/win-x64/pack/*.exe
            build/dist/win-x64/pack/*.nupkg
            build/dist/win-x64/pack/releases.win.json
          if-no-files-found: error

  build-linux:
    name: Build Linux x64
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build -- --verbose

      # MōBrowser currently provides no native Linux installer.
      - name: Pack Linux binaries
        run: tar -czf sitemap-builder-linux-x64.tar.gz -C build/dist/linux-x64/bin .

      - name: Upload Linux artifact
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: artifacts-linux-x64
          path: sitemap-builder-linux-x64.tar.gz
          if-no-files-found: error

  release:
    name: Create GitHub Release draft
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    needs:
      - build-macos
      - build-windows
      - build-linux
    runs-on: ubuntu-latest

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          path: dist

      - name: Create draft release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          files: |
            dist/artifacts-macos/**/*.dmg
            dist/artifacts-macos/**/*.nupkg
            dist/artifacts-macos/**/releases.osx.json
            dist/artifacts-windows-x64/**/*.exe
            dist/artifacts-windows-x64/**/*.nupkg
            dist/artifacts-windows-x64/**/releases.win.json
            dist/artifacts-linux-x64/**/*.tar.gz
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          draft: true

      - name: List release artifacts
        run: find dist -type f -print
